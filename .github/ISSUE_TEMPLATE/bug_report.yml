name: Bug Report
description: Report a reproducible defect in RubberDeck
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Verify the issue has not already been reported before opening a new ticket.
        For security vulnerabilities, follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: Concise description of the defect.
      placeholder: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Connect via Web Bluetooth / Web Serial / Capacitor BLE
        2. Select profile (rubberotter or rubberorca)
        3. Trigger action '...'
        4. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output
      description: Paste relevant browser console logs, ACK error codes, or terminal output.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser or Capacitor target, Node version, and hardware profile.
      placeholder: macOS 15, Chrome 135, Node 22.14, rubberorca
    validations:
      required: true
